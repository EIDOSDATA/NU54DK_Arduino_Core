tests:
  nucode.m21.ble_security_hil_peripheral:
    tags:
      - nucode
      - arduino
      - m21
      - bluetooth
      - security
      - hid
      - hil
    build_only: true
    extra_args:
      - M21_ROLE=peripheral
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
  nucode.m21.ble_security_hil_central:
    tags:
      - nucode
      - arduino
      - m21
      - bluetooth
      - security
      - hid
      - hil
    build_only: true
    extra_args:
      - M21_ROLE=central
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
