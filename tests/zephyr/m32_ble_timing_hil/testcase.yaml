tests:
  nucode.m32.ble_timing_hil.central:
    build_only: true
    extra_args:
      - M32_TIMING_ROLE=central
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    tags:
      - bluetooth
      - m32
      - timing
      - feature
      - hil
  nucode.m32.ble_timing_hil.peripheral:
    build_only: true
    extra_args:
      - M32_TIMING_ROLE=peripheral
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    tags:
      - bluetooth
      - m32
      - timing
      - feature
      - hil
