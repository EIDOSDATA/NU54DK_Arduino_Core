tests:
  nucode.ac01.gpio_hil:
    tags:
      - nucode
      - arduino
      - ac01
      - gpio
      - hil
    harness: console
    harness_config:
      type: one_line
      regex:
        - "NUCODE_AC01_GPIO_HIL_PASS"
    sysbuild: false
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
