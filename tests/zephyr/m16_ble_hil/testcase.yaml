tests:
  nucode.m16.ble_hil_peripheral:
    tags:
      - nucode
      - arduino
      - m16
      - bluetooth
      - hil
    build_only: true
    extra_args:
      - M16_ROLE=peripheral
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
  nucode.m16.ble_hil_central:
    tags:
      - nucode
      - arduino
      - m16
      - bluetooth
      - hil
    build_only: true
    extra_args:
      - M16_ROLE=central
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk

