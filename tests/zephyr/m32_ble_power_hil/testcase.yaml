tests:
  nucode.m32.ble_power_hil.central:
    build_only: true
    extra_args:
      - M32_POWER_ROLE=central
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    tags:
      - bluetooth
      - m32
      - power
      - path_loss
      - hil
  nucode.m32.ble_power_hil.peripheral:
    build_only: true
    extra_args:
      - M32_POWER_ROLE=peripheral
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    tags:
      - bluetooth
      - m32
      - power
      - path_loss
      - hil
