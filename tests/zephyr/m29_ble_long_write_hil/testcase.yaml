tests:
  nucode.m29.ble_long_write_peripheral:
    tags:
      - nucode
      - arduino
      - m29
      - bluetooth
      - gatt
      - hil
    build_only: true
    extra_args:
      - M29_LONG_WRITE_ROLE=peripheral
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
  nucode.m29.ble_long_write_central:
    tags:
      - nucode
      - arduino
      - m29
      - bluetooth
      - gatt
      - hil
    build_only: true
    extra_args:
      - M29_LONG_WRITE_ROLE=central
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/nu54dk
