# SPDX-License-Identifier: MIT

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_NUCODE_ARDUINO_CORE=y
CONFIG_NUCODE_ARDUINO_RUNTIME=y
CONFIG_NUCODE_ARDUINO_API=y
CONFIG_NUCODE_ARDUINO_TIME=y
CONFIG_NUCODE_ARDUINO_SERIAL=y

CONFIG_BT=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_ISO_MAX_CHAN=1
CONFIG_BT_ISO_TX_BUF_COUNT=4
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=4
CONFIG_BT_ISO_TX_MTU=16
CONFIG_BT_ISO_RX_MTU=23

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# SPDX-License-Identifier: MIT

CONFIG_BT_ISO_SYNC_RECEIVER=y
CONFIG_BT_PER_ADV_SYNC=y

CONFIG_NUCODE_BLE_ISO=y
CONFIG_NUCODE_BLE_ISO_MODE_BIS_TIME_RECEIVER=y
