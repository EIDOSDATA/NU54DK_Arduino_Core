# NU54DK board/system API가 사용하는 공개 Zephyr subsystem입니다.
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y
CONFIG_POWEROFF=y
CONFIG_PM_DEVICE=y

# nucode/ namespace의 key-value 저장소는 기존 storage_partition만 사용합니다.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_LOAD_SUBTREE_PATH=y
# 손상 시 자동 erase하는 SETTINGS_ZMS_FORCE_MOUNT는 의도적으로 켜지 않습니다.
