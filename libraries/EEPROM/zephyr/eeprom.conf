# EEPROM mirror는 기존 storage_partition의 독립 arduino/eeprom key를 사용합니다.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_LOAD_SUBTREE_PATH=y
# 손상된 Settings 영역을 암묵적으로 지우지 않습니다.
# CONFIG_SETTINGS_ZMS_FORCE_MOUNT is not set
