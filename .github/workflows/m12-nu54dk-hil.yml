name: M12 NU54DK HIL

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: pyOCD upload repetition count
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "10"

permissions:
  contents: read

concurrency:
  group: nu54dk-hil-device
  cancel-in-progress: false

jobs:
  nu54dk-hil:
    name: Physical NU54DK pyOCD upload and UART
    runs-on: [self-hosted, Windows, X64, nu54dk-hil]
    timeout-minutes: 90
    env:
      NU54DK_HIL_AUTHORIZATION: ${{ secrets.NU54DK_HIL_AUTHORIZATION }}
      HIL_EVIDENCE: ${{ runner.temp }}\nu54dk-hil-${{ github.run_id }}
    steps:
      - name: Require repository HIL authorization
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NU54DK_HIL_AUTHORIZATION)) {
            throw 'NU54DK_HIL_AUTHORIZATION repository secret이 없습니다.'
          }
      - name: Checkout exact source and board package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Python 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.11
      - name: Verify pinned source and installed NCS
        shell: powershell
        run: |
          python .\tools\ci\verify_ci_lock.py
          python .\tools\ci\verify_ci_lock.py --workspace "$env:USERPROFILE\ncs\v3.4.0"
      - name: Run physical pyOCD upload and UART readiness test
        shell: powershell
        run: >-
          python .\tests\hil\nu54dk\m8_upload.py
          --workspace "$env:HIL_EVIDENCE"
          --runner pyocd
          --serial-port auto
          --repetitions "${{ inputs.repetitions }}"
      - name: Upload hardware evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m12-nu54dk-hil-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.HIL_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 30
