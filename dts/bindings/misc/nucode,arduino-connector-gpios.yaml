# SPDX-License-Identifier: MIT

description: NU54DK Arduino connector GPIO 역할 묶음

compatible: "nucode,arduino-connector-gpios"

include: base.yaml

child-binding:
  properties:
    gpios:
      type: phandle-array
      required: true
      description: Arduino connector GPIO 역할에 연결할 GPIO

    label:
      type: string
      description: Arduino connector GPIO 역할을 설명하는 이름
