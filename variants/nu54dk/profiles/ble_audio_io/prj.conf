# PDM/I2S Fabric은 nrfx IRQ를 직접 소유하므로 표준 singleton과 함께 켜지 않습니다.
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_ADC=n
CONFIG_PWM=n
CONFIG_I2S=n

CONFIG_NUCODE_ARDUINO_SERIAL=n
CONFIG_NUCODE_ARDUINO_SERIAL1=n
CONFIG_NUCODE_ARDUINO_INTERRUPTS=n
CONFIG_NUCODE_ARDUINO_WIRE=n
CONFIG_NUCODE_ARDUINO_SPI=n
CONFIG_NUCODE_ARDUINO_ADC=n
CONFIG_NUCODE_ARDUINO_PWM=n

# P1.4~P1.7 외부 audio 배선은 DAP UART를 물리적으로 분리한 뒤에만 사용합니다.
CONFIG_NUCODE_ARDUINO_DAP_UART_GPIO_PINS=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NUCODE_ARDUINO_STREAM_FABRIC=y
