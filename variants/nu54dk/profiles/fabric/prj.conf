# SPDX-License-Identifier: MIT

# Fabric은 직접 nrfx IRQ를 소유하므로 기존 singleton driver와 함께 켜지 않습니다.
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_ADC=n
CONFIG_PWM=n
CONFIG_I2S=n

CONFIG_NUCODE_ARDUINO_SERIAL=n
CONFIG_NUCODE_ARDUINO_SERIAL1=n
CONFIG_NUCODE_ARDUINO_INTERRUPTS=n
CONFIG_NUCODE_ARDUINO_WIRE=n
CONFIG_NUCODE_ARDUINO_SPI=n
CONFIG_NUCODE_ARDUINO_ADC=n
CONFIG_NUCODE_ARDUINO_PWM=n

# 이 profile 선택은 보드의 DAP UART 스위치가 분리됐다는 사용자 확인을 뜻합니다.
CONFIG_NUCODE_ARDUINO_DAP_UART_GPIO_PINS=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_NUCODE_ARDUINO_SERIAL_FABRIC=y
CONFIG_NUCODE_ARDUINO_SERIAL_FABRIC_UARTE=y
CONFIG_NUCODE_ARDUINO_SERIAL_FABRIC_SPIM=y
CONFIG_NUCODE_ARDUINO_SERIAL_FABRIC_SPIS=y
CONFIG_NUCODE_ARDUINO_SERIAL_FABRIC_TWIM=y
CONFIG_NUCODE_ARDUINO_SERIAL_FABRIC_TWIS=y

CONFIG_NUCODE_ARDUINO_ANALOG_FABRIC=y
CONFIG_NUCODE_ARDUINO_EVENT_FABRIC=y
CONFIG_NUCODE_ARDUINO_STREAM_FABRIC=y
CONFIG_NUCODE_ARDUINO_SYSTEM_FABRIC=y

CONFIG_NRF_SYS_EVENT=y
CONFIG_NRF_SYS_EVENT_IRQ_LATENCY=n
